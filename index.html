<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="background">
    <h1 class="app-title">Live Weather App</h1>
    <div class="card">
        <div class="search">
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Enter city name" spellcheck="false">
                <button class="search-button">
                    <img src="images/search.png" class="search-icon">
                </button>
            </div>
        </div>
        <div class="weather">
            <img src="images/default.png" class="weather-icon">
            <h1 class="temp">--°C</h1>
            <h2 class="city">--</h2>
            <p class="description">Weather description</p>
            <div class="details">
                <div class="col">
                    <img src="images/humidity.png">
                    <div>
                        <p class="humidity">--%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/wind.png">
                    <div>
                        <p class="wind">-- km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <p class="footer">WEB-BLITZ 5.0 Project <br> © Nibir Deka</p>
 
    <audio id="clickSound" src="sounds/click.mp3"></audio>
    <audio id="successSound" src="sounds/success.mp3"></audio>

    <script>
        const apiKey = "eea816088421b1ccaf289f13dbe7abe6";
        const apiUrl = "https://api.openweathermap.org/data/2.5/weather?&units=metric&q=";
        const searchBox = document.querySelector(".search-input");
        const searchBtn = document.querySelector(".search-button");
        const weatherIcon = document.querySelector(".weather-icon");
        const background = document.getElementById("background");

       
        const clickSound = document.getElementById("clickSound");
        const successSound = document.getElementById("successSound");

        async function checkWeather(city) {
            try {
                if (city.trim() !== "") {
                    clickSound.play();
                }

                const response = await fetch(apiUrl + city + `&appid=${apiKey}`);
                if (!response.ok) throw new Error("City not found");
                const data = await response.json();

                document.querySelector(".city").innerHTML = data.name;
                document.querySelector(".temp").innerHTML = `${data.main.temp}°C`;
                document.querySelector(".humidity").innerHTML = `${data.main.humidity}%`;
                document.querySelector(".wind").innerHTML = `${data.wind.speed} km/h`;
                document.querySelector(".description").innerHTML = data.weather[0].description;

                updateWeatherIcon(data.weather[0].main);
                updateBackgroundImage(data.weather[0].main);
                document.querySelector(".weather").style.display = "block";

                setTimeout(() => successSound.play(), 500);
            } catch (error) {
                alert("City not found. Please enter a valid city.");
            }
        }

        function updateWeatherIcon(weather) {
            const weatherIcons = {
                Clouds: "images/clouds.png",
                Clear: "images/clear.png",
                Rain: "images/rain.png",
                Drizzle: "images/drizzle.png",
                Mist: "images/mist.png"
            };
            weatherIcon.src = weatherIcons[weather] || "images/default.png";
        }

        function updateBackgroundImage(weather) {
            const weatherImages = {
                Clear: "url('backgroundImage/clear_sky.png')",
                Clouds: "url('backgroundImage/cloud_.png')",
                Rain: "url('backgroundImage/rain_.png')",
                Drizzle: "url('backgroundImage/drizzle_.png')",
                Mist: "url('backgroundImage/mist_.png')",
                Default: "url('backgroundImage/default_.png')"
            };

            background.style.transition = "background 1s ease-in-out";
            background.style.backgroundImage = weatherImages[weather] || weatherImages["default_"];
            background.style.backgroundSize = "cover";
            background.style.backgroundPosition = "center";
            background.style.backgroundRepeat = "no-repeat";
        }

        searchBtn.addEventListener("click", () => {
            if (searchBox.value.trim() !== "") {
                checkWeather(searchBox.value);
            }
        });

        searchBox.addEventListener("keypress", (event) => {
            if (event.key === "Enter" && searchBox.value.trim() !== "") {
                checkWeather(searchBox.value);
            }
        });
    </script>
</body>
</html>
